backend:
  name: github
  repo: IamMaheshGurung/lahureytochaureyweb
  branch: main
  base_path: lahurey-to-chaurey-COMPLETE

media_folder: "lahurey-to-chaurey-COMPLETE/public/images/uploads"
public_folder: "/images/uploads"

site_url: "https://lahureytochaurey.netlify.app"
display_url: "https://lahureytochaurey.netlify.app"

collections:
  - name: "stories"
    label: "Stories"
    folder: "lahurey-to-chaurey-COMPLETE/src/content/stories"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "Title NP", name: "title", widget: "string" }
      - { label: "Title EN", name: "titleEn", widget: "string", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["कृषि र खाद्य","रेमिट्यान्स र लाहुरे","स्टार्टअप र नवप्रवर्तन","पर्यटन र संस्कृति","वातावरण र ऊर्जा","पूर्वाधार र विकास","मानिस र समाज","प्रविधि र डिजिटल","शिक्षा र युवा"] }
      - { label: "Type", name: "type", widget: "select", options: ["केस स्टडी","कथा"] }
      - { label: "Language", name: "language", widget: "select", options: ["नेपाली","English","दुबै"] }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Read Time", name: "readTime", widget: "string", default: "५ मिनेट" }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Summary - के भयो?", name: "summaryWhat", widget: "text", required: false }
      - { label: "Summary - किन महत्त्वपूर्ण?", name: "summaryWhy", widget: "text", required: false }
      - { label: "Summary - के सिकाइ होला?", name: "summaryLesson", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pulse"
    label: "Pulse Posts"
    folder: "lahurey-to-chaurey-COMPLETE/src/content/pulse"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
